<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<title>Teen Patti Gold Online</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#061a15;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
}

:root{
  --gold:#f2c64b;
  --gold2:#ffdf78;
  --green:#087b60;
  --green2:#0b9b72;
  --dark:#06261d;
  --purple:#251334;
}

.game{
  position:relative;
  width:100vw;
  height:100vh;
  max-width:520px;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 58%,
      #12a77a 0,
      #08775d 42%,
      #043a2e 78%,
      #021d17 100%
    );
}

.game:before{
  content:"";
  position:absolute;
  inset:13px;

  border:3px solid #b47a22;

  box-shadow:
    inset 0 0 0 3px #4b2810,
    inset 0 0 35px #0008,
    0 0 0 2px #15100b;

  pointer-events:none;
  z-index:30;
}

.header{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);

  width:49%;
  height:43px;

  border:1px solid #c99b31;
  border-radius:25px;

  background:#071613e8;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:15px;

  z-index:40;

  box-shadow:
    0 3px 15px #0008;
}

.iconbtn{
  position:absolute;

  top:22px;

  width:58px;
  height:58px;

  border:1px solid #d4a83e;
  border-radius:14px;

  background:#071713e8;

  color:#fff;

  font-size:24px;

  z-index:40;
}

.sound{
  right:72px;
}

.menu{
  right:12px;
}

.dealer{
  position:absolute;

  top:72px;
  left:50%;

  transform:translateX(-50%);

  width:145px;

  text-align:center;

  z-index:25;
}

.dealer-ring{
  width:105px;
  height:105px;

  margin:auto;

  border-radius:50%;

  border:5px solid var(--gold);

  background:#4d0d2c;

  box-shadow:
    0 0 22px #ffd85a88,
    0 5px 20px #0008;

  overflow:hidden;

  display:flex;

  align-items:flex-start;
  justify-content:center;
}

.dealer-ring img{
  width:100%;
  height:100%;

  object-fit:cover;

  object-position:center 18%;

  display:block;
}

.dealer-name{
  margin-top:6px;

  color:#ffe17a;

  font-size:15px;

  font-weight:800;

  text-shadow:
    0 2px 5px #000;
}

.table{
  position:absolute;

  left:4%;
  right:4%;

  top:335px;
  bottom:175px;

  border-radius:
    48% 48% 44% 44% /
    24% 24% 30% 30%;

  background:
    radial-gradient(
      circle at 50% 44%,
      #0ea579,
      #087b5e 60%,
      #07533f 100%
    );

  border:10px solid #4b2a16;

  box-shadow:
    0 0 0 5px #c1872c,
    inset 0 0 55px #001f18,
    0 12px 35px #0009;

  z-index:5;
}

.table:after{
  content:"";

  position:absolute;

  inset:27% 22%;

  border:
    2px solid #a9b95c66;

  border-radius:50%;

  box-shadow:
    inset 0 0 30px #003c2d66;
}

.logo{
  position:absolute;

  left:50%;
  top:48%;

  transform:
    translate(-50%,-50%);

  font-size:27px;

  line-height:1.05;

  text-align:center;

  font-weight:900;

  color:#a3a86c55;

  z-index:2;
}

.pot{
  position:absolute;

  left:50%;
  top:40%;

  transform:
    translate(-50%,-50%);

  text-align:center;

  z-index:10;

  text-shadow:
    0 2px 5px #000;
}

.pot small{
  display:block;

  color:#ffe079;

  font-size:15px;

  letter-spacing:3px;
}

.pot strong{
  display:block;

  font-size:38px;

  margin-top:2px;
}

.chip{
  width:82px;
  height:82px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #e4313d 0 42%,
      #fff 43% 57%,
      #c72b37 58% 67%,
      #fff 68% 76%,
      #a71927 77%
    );

  border:4px solid #eee;

  box-shadow:
    0 4px 14px #0008;

  margin:10px auto;
}

.seat{
  position:absolute;

  z-index:15;

  width:145px;

  text-align:center;

  color:#fff;

  text-shadow:
    0 2px 5px #000;

  font-size:14px;

  font-weight:800;
}

.seat .ava{
  width:62px;
  height:62px;

  border-radius:50%;

  margin:auto;

  border:3px solid var(--gold);

  background:
    linear-gradient(
      #2a2145,
      #10152c
    );

  display:grid;
  place-items:center;

  font-size:27px;

  box-shadow:
    0 0 15px #ffd65c66;
}

.seat .bal{
  color:#ffd95e;

  font-size:13px;

  margin-top:3px;
}

.seat .cards{
  display:flex;

  justify-content:center;

  gap:3px;

  margin-top:6px;
}

.seat .back{
  width:38px;
  height:55px;

  border-radius:6px;

  border:2px solid #e6bb47;

  background:
    repeating-linear-gradient(
      135deg,
      #741a3e 0 6px,
      #a11f50 6px 9px
    );

  box-shadow:
    0 3px 8px #0009;

  display:grid;

  place-items:center;

  color:#ffd45d;

  font-size:18px;
}

.seat .card{
  width:43px;
  height:58px;

  border-radius:6px;

  background:#fff;

  color:#111;

  border:1px solid #ddd;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:18px;

  font-weight:900;

  box-shadow:
    0 3px 8px #0009;
}

.seat .red{
  color:#d21f2f;
}

.topseat{
  left:50%;

  transform:
    translateX(-50%);

  top:190px;
}

.leftseat{
  left:19px;

  top:48%;
}

.rightseat{
  right:19px;

  top:48%;
}

.me{
  left:50%;

  transform:
    translateX(-50%);

  bottom:115px;
}

.controls{
  position:absolute;

  left:14px;
  right:14px;

  bottom:17px;

  display:grid;

  grid-template-columns:
    1fr
    1.15fr
    1fr
    1.15fr
    1fr;

  gap:7px;

  z-index:50;
}

.btn{
  height:62px;

  border-radius:13px;

  border:1px solid #d9ab42;

  color:#fff;

  background:
    linear-gradient(
      #2b1740,
      #170b25
    );

  font-weight:900;

  font-size:13px;

  box-shadow:
    0 4px 10px #0008;
}

.btn.gold{
  background:
    linear-gradient(
      #f2ce63,
      #b77612
    );

  color:#241500;
}

.btn:disabled{
  opacity:.35;
}

.turn{
  animation:pulse 1s infinite;
}

.hidden{
  display:none!important;
}

.notice{
  position:absolute;

  left:50%;
  top:47px;

  transform:
    translateX(-50%);

  z-index:60;

  padding:7px 12px;

  border:1px solid #d5a83f;

  border-radius:14px;

  background:#140c20e8;

  font-size:12px;

  opacity:0;

  transition:.2s;

  pointer-events:none;

  white-space:nowrap;
}

.notice.show{
  opacity:1;
}

.overlay{
  position:absolute;

  inset:0;

  background:#00110dd9;

  z-index:100;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:28px;
}

.panel{
  width:min(92%,430px);

  border:3px solid var(--gold);

  border-radius:25px;

  background:
    linear-gradient(
      145deg,
      #241437,
      #0c1820
    );

  padding:28px 22px;

  box-shadow:
    0 15px 45px #000b;

  text-align:center;
}

.panel img{
  width:130px;
  height:130px;

  border-radius:50%;

  object-fit:cover;

  object-position:center 18%;

  border:5px solid var(--gold);

  box-shadow:
    0 0 25px #ffd55a66;
}

.panel h1{
  margin:16px 0 4px;

  color:#ffd75b;

  font-size:36px;
}

.panel p{
  margin:0 0 20px;

  color:#c8c8cf;
}

.name{
  width:100%;
  height:50px;

  border-radius:12px;

  border:1px solid #c99c3c;

  background:#080d12;

  color:#fff;

  padding:0 15px;

  font-size:17px;

  text-align:center;

  outline:none;

  margin-bottom:12px;
}

.join{
  width:100%;
  height:58px;

  border:1px solid #ffe083;

  border-radius:14px;

  background:
    linear-gradient(
      #ffd85c,
      #b87a16
    );

  font-size:19px;

  font-weight:900;

  color:#1d1300;
}

@keyframes pulse{

  50%{
    box-shadow:
      0 0 20px #ffe06a;
  }

}

@media(max-height:760px){

  .dealer{
    top:62px;
  }

  .dealer-ring{
    width:88px;
    height:88px;
  }

  .topseat{
    top:158px;
  }

  .table{
    top:285px;
    bottom:158px;
  }

  .me{
    bottom:101px;
  }

  .controls{
    bottom:10px;
  }

  .btn{
    height:54px;
    font-size:11px;
  }

  .seat .ava{
    width:55px;
    height:55px;
  }

}

</style>

</head>

<body>

<div class="game" id="game">

<div
  class="header"
  id="count"
>
Players 0/4
</div>

<button
  class="iconbtn sound"
  id="sound"
>
🔊
</button>

<button
  class="iconbtn menu"
  id="menu"
>
✕
</button>

<div class="dealer">

  <div class="dealer-ring">

    <img
      src="assets/dealer.png"
      alt="Dealer"
    >

  </div>

  <div class="dealer-name">
    DEALER
  </div>

</div>

<div class="table">

  <div class="logo">
    TEEN PATTI<br>
    GOLD
  </div>

  <div class="pot">

    <small>
      POT
    </small>

    <strong id="pot">
      ₹0
    </strong>

    <div class="chip"></div>

  </div>

  <div id="seats"></div>

</div>

<div class="controls">

  <button
    class="btn"
    id="pack"
  >
    PACK
  </button>

  <button
    class="btn"
    id="side"
  >
    SIDE SHOW
  </button>

  <button
    class="btn gold"
    id="chaal"
  >
    CHAAL
  </button>

  <button
    class="btn gold"
    id="chaal2"
  >
    2X CHAAL
  </button>

  <button
    class="btn"
    id="show"
  >
    SHOW
  </button>

</div>

<div
  class="notice"
  id="notice"
></div>

<div
  class="overlay"
  id="overlay"
>

  <div class="panel">

    <img
      src="assets/dealer.png"
      alt="Dealer"
    >

    <h1>
      TEEN PATTI
    </h1>

    <p>
      GOLD ONLINE TABLE
    </p>

    <input
      class="name"
      id="name"
      maxlength="16"
      placeholder="Your name"
    >

    <button
      class="join"
      id="join"
    >
      JOIN TABLE
    </button>

  </div>

</div>

</div>

<script>

const $ =
  id =>
    document.getElementById(id);

let playerId =
  localStorage.getItem(
    "tp_pid"
  ) || "";

let muted = false;

let state = null;

let audioContext = null;

function toast(text){

  const notice =
    $("notice");

  notice.textContent =
    text;

  notice.classList.add(
    "show"
  );

  clearTimeout(
    toast.timer
  );

  toast.timer =
    setTimeout(
      () =>
        notice.classList.remove(
          "show"
        ),
      1800
    );
}

function playSound(
  frequency = 500,
  duration = 0.08
){

  if(muted){
    return;
  }

  try{

    audioContext =
      audioContext ||
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.frequency.value =
      frequency;

    gain.gain.value =
      0.035;

    oscillator.connect(
      gain
    );

    gain.connect(
      audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime +
      duration
    );

  }catch(e){}

}

function escapeHtml(value){

  return String(value)
    .replace(
      /[&<>"']/g,
      char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[char])
    );

}

function cardHtml(card){

  if(!card){
    return "";
  }

  const red =
    card.suit === "♥" ||
    card.suit === "♦";

  return `
    <div
      class="card ${red ? "red" : ""}"
    >
      ${escapeHtml(card.rank)}
      ${card.suit}
    </div>
  `;
}

function render(gameState){

  state =
    gameState;

  const online =
    gameState.players
      .filter(
        p => p.connected
      )
      .length;

  $("count").textContent =
    `Players ${online}/4`;

  $("pot").textContent =
    "₹" +
    Number(
      gameState.pot || 0
    ).toLocaleString();

  const positions = [
    "me",
    "topseat",
    "leftseat",
    "rightseat"
  ];

  $("seats").innerHTML =
    gameState.players
      .map(player => {

        const mine =
          player.id ===
          playerId;

        const showCards =
          mine ||
          gameState.phase ===
          "finished";

        let cardsHtml = "";

        if(showCards){

          cardsHtml =
            (player.cards || [])
              .map(cardHtml)
              .join("");

        }else{

          cardsHtml = `
            <div class="back">♠</div>
            <div class="back">♠</div>
            <div class="back">♠</div>
          `;

        }

        const avatar =
          player.seat === 0
            ? "🙂"
            : player.seat === 1
              ? "👩"
              : player.seat === 2
                ? "😎"
                : "🧑";

        return `
          <div
            class="
              seat
              ${positions[player.seat] || ""}
              ${
                gameState.turn ===
                player.id
                  ? "turn"
                  : ""
              }
            "
          >

            <div class="ava">
              ${avatar}
            </div>

            <div>
              ${escapeHtml(
                player.name
              )}

              ${
                player.packed
                  ? " — PACKED"
                  : ""
              }
            </div>

            <div class="bal">
              ₹${Number(
                player.balance || 0
              ).toLocaleString()}
            </div>

            <div class="cards">
              ${cardsHtml}
            </div>

          </div>
        `;

      })
      .join("");

  const me =
    gameState.players.find(
      p =>
        p.id === playerId
    );

  const myTurn =
    gameState.turn ===
      playerId &&
    gameState.phase ===
      "playing" &&
    !me?.packed;

  [
    "pack",
    "side",
    "chaal",
    "chaal2",
    "show"
  ].forEach(id => {

    $(id).disabled =
      !myTurn;

  });

}

async function joinTable(){

  const name =
    $("name")
      .value
      .trim() ||
    "Player";

  localStorage.setItem(
    "tp_name",
    name
  );

  try{

    const response =
      await fetch(
        "/join",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              id:
                playerId ||
                null,

              name
            })
        }
      );

    const data =
      await response.json();

    if(!response.ok){
      throw new Error(
        data.error ||
        "Join failed"
      );
    }

    playerId =
      data.id;

    localStorage.setItem(
      "tp_pid",
      playerId
    );

    $("overlay")
      .classList
      .add("hidden");

    playSound(
      650,
      0.12
    );

    connect();

  }catch(error){

    toast(
      error.message
    );

  }

}

function connect(){

  const stream =
    new EventSource(
      "/stream?id=" +
      encodeURIComponent(
        playerId
      )
    );

  stream.onopen =
    () => {

      toast(
        "Connected"
      );

    };

  stream.onmessage =
    event => {

      try{

        const message =
          JSON.parse(
            event.data
          );

        if(
          message.type ===
          "welcome"
        ){

          playSound(
            800,
            0.08
          );

        }

        else if(
          message.type ===
          "state"
        ){

          render(
            message
          );

        }

        else if(
          message.type ===
          "notice"
        ){

          toast(
            message.text
          );

          playSound(
            420,
            0.06
          );

        }

        else if(
          message.type ===
          "result"
        ){

          toast(
            message.winnerName +
            " won ₹" +
            Number(
              message.pot
            ).toLocaleString()
          );

          playSound(
            900,
            0.18
          );

        }

        else if(
          message.type ===
          "error"
        ){

          toast(
            message.text
          );

        }

      }catch(e){}

    };

  stream.onerror =
    () => {

      stream.close();

      toast(
        "Reconnecting..."
      );

      setTimeout(
        () => {

          if(
            playerId
          ){
            connect();
          }

        },
        1800
      );

    };

}

async function action(
  actionName
){

  if(!playerId){
    return;
  }

  try{

    await fetch(
      "/action",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            id:
              playerId,

            action:
              actionName
          })
      }
    );

    if(
      actionName === "chaal" ||
      actionName === "chaal2"
    ){

      playSound(
        620,
        0.07
      );

    }else{

      playSound(
        430,
        0.07
      );

    }

  }catch(e){

    toast(
      "Connection lost"
    );

  }

}

$("join").onclick =
  joinTable;

$("name").value =
  localStorage.getItem(
    "tp_name"
  ) || "";

$("pack").onclick =
  () => action("pack");

$("side").onclick =
  () => action("sideshow");

$("chaal").onclick =
  () => action("chaal");

$("chaal2").onclick =
  () => action("chaal2");

$("show").onclick =
  () => action("show");

$("sound").onclick =
  () => {

    muted =
      !muted;

    $("sound").textContent =
      muted
        ? "🔇"
        : "🔊";

    toast(
      muted
        ? "Sound off"
        : "Sound on"
    );

    if(!muted){
      playSound();
    }

  };

$("menu").onclick =
  () => {

    toast(
      "Table menu"
    );

  };

</script>

</body>
</html>
