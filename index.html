<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Teen Patti Gold</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#080b0d;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.game{
    position:relative;
    width:100%;
    height:100%;
    max-width:600px;
    overflow:hidden;
    background:
        radial-gradient(
            ellipse at center,
            #168a69 0%,
            #0b7056 38%,
            #07503f 70%,
            #032d26 100%
        );
}

/* OUTER FRAME */

.game:before{
    content:"";
    position:absolute;
    inset:8px;
    z-index:100;
    pointer-events:none;

    border:5px solid #24140a;

    box-shadow:
        inset 0 0 0 3px #bd7c28,
        inset 0 0 25px rgba(0,0,0,.75);
}

/* TABLE */

.table{
    position:absolute;

    left:3.5%;
    right:3.5%;

    top:25%;
    bottom:13%;

    border-radius:47% / 20%;

    background:
        radial-gradient(
            ellipse at center,
            #15906e 0%,
            #0b765a 48%,
            #075540 80%,
            #04392f 100%
        );

    border:7px solid #2b180b;

    box-shadow:
        0 0 0 4px #b87525,
        inset 0 0 35px rgba(0,0,0,.65),
        0 10px 25px rgba(0,0,0,.55);
}

.table-logo{
    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:175px;
    height:105px;

    border:2px solid rgba(239,205,113,.4);
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    color:rgba(255,224,150,.35);

    font-size:21px;
    font-weight:bold;
    line-height:1.05;
    letter-spacing:2px;
}

/* STATUS */

.status{
    position:absolute;
    z-index:150;

    top:8px;
    left:50%;

    transform:translateX(-50%);

    min-width:190px;

    padding:8px 20px;

    border:1px solid #d8a943;
    border-radius:25px;

    background:rgba(5,7,10,.88);

    color:white;

    text-align:center;

    font-size:12px;

    box-shadow:0 3px 10px rgba(0,0,0,.4);
}

/* TOP BUTTONS */

.top-controls{
    position:absolute;

    z-index:150;

    top:62px;
    right:17px;

    display:flex;
    gap:8px;
}

.icon-btn{
    width:43px;
    height:40px;

    border-radius:10px;

    border:1px solid #d9aa42;

    background:rgba(5,7,10,.82);

    color:white;

    font-size:18px;
}

/* DEALER */

.dealer{
    position:absolute;

    z-index:120;

    top:55px;
    left:50%;

    transform:translateX(-50%);

    text-align:center;
}

.dealer-avatar{
    width:72px;
    height:72px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:39px;

    background:
        radial-gradient(
            circle at 50% 30%,
            #ffd9c4 0 14%,
            transparent 15%
        ),
        linear-gradient(
            145deg,
            #9c2039,
            #3b0c1d
        );

    border:3px solid #e6b747;

    box-shadow:
        0 0 0 4px rgba(0,0,0,.25),
        0 0 20px rgba(255,199,70,.4);
}

.dealer-name{
    margin-top:4px;

    color:#ffe08a;

    font-size:11px;
    font-weight:bold;

    text-shadow:0 2px 4px #000;
}

/* POT */

.pot{
    position:absolute;

    z-index:80;

    top:49%;
    left:50%;

    transform:translate(-50%,-50%);

    width:150px;

    text-align:center;
}

.pot-title{
    color:#f5d277;

    font-size:12px;
    font-weight:bold;

    letter-spacing:3px;
}

.pot-value{
    margin-top:2px;

    color:white;

    font-size:27px;
    font-weight:900;

    text-shadow:
        0 2px 5px #000;
}

.chips{
    width:55px;
    height:55px;

    margin:8px auto 0;

    border-radius:50%;

    background:
        repeating-conic-gradient(
            #ffffff 0deg 18deg,
            #c92c35 18deg 36deg
        );

    border:5px solid #eee;

    box-shadow:
        0 4px 9px #000;
}

.chips:after{
    content:"";

    display:block;

    width:29px;
    height:29px;

    margin:8px;

    border-radius:50%;

    background:#d72e36;

    border:3px solid white;
}

/* PLAYERS */

.players{
    position:absolute;
    inset:0;

    z-index:110;
}

.player{
    position:absolute;

    width:112px;

    text-align:center;

    color:white;

    transition:.25s;
}

/* BOTTOM PLAYER */

.p0{
    left:50%;
    bottom:82px;

    transform:translateX(-50%);
}

/* LEFT PLAYER */

.p1{
    left:7%;
    top:49%;

    transform:translateY(-50%);
}

/* TOP PLAYER */

.p2{
    left:50%;
    top:155px;

    transform:translateX(-50%);
}

/* RIGHT PLAYER */

.p3{
    right:7%;
    top:49%;

    transform:translateY(-50%);
}

/* AVATAR */

.avatar{
    width:50px;
    height:50px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #f5cc67,
            #85540e
        );

    border:2px solid #ffe18a;

    box-shadow:
        0 3px 10px #000;

    font-size:23px;
}

.player.turn .avatar{
    animation:turnGlow 1s infinite;
}

@keyframes turnGlow{

    50%{
        box-shadow:
            0 0 0 5px rgba(255,218,75,.25),
            0 0 25px #ffd44c;
    }
}

.player-name{
    margin-top:3px;

    font-size:12px;
    font-weight:bold;

    text-shadow:0 2px 4px #000;
}

.player-money{
    color:#ffd66b;

    font-size:11px;

    text-shadow:0 1px 3px #000;
}

/* CARDS */

.cards{
    display:flex;

    justify-content:center;

    height:48px;

    margin-top:5px;
}

.card{
    width:35px;
    height:47px;

    margin-left:-6px;

    border-radius:5px;

    background:white;

    color:#111;

    border:1px solid #aaa;

    box-shadow:
        0 3px 7px #000;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:13px;
    font-weight:bold;
}

.card:first-child{
    margin-left:0;
}

.card.red{
    color:#d21b27;
}

/* CARD BACK */

.card.back{
    background:
        repeating-linear-gradient(
            45deg,
            #64152b,
            #64152b 4px,
            #a32640 4px,
            #a32640 8px
        );

    border:2px solid #e4b94e;
}

.card.back:after{
    content:"♠";

    color:#edc354;

    font-size:20px;
}

/* BOTTOM BUTTONS */

.actions{
    position:absolute;

    z-index:160;

    left:12px;
    right:12px;
    bottom:12px;

    display:flex;

    gap:7px;
}

.action{
    flex:1;

    height:50px;

    border-radius:11px;

    border:1px solid #d8aa45;

    background:
        linear-gradient(
            #452460,
            #21112f
        );

    color:white;

    font-size:10px;

    font-weight:bold;

    box-shadow:
        0 4px 9px #000;
}

.action.gold{
    background:
        linear-gradient(
            #f4d477,
            #a96e17
        );

    color:#251500;
}

.action:disabled{
    opacity:.42;
}

.action:active{
    transform:scale(.96);
}

/* NOTICE */

.notice{
    position:absolute;

    z-index:200;

    left:50%;
    top:60%;

    transform:translate(-50%,-50%);

    width:max-content;

    max-width:82%;

    padding:11px 18px;

    border-radius:12px;

    border:1px solid #d8a943;

    background:rgba(0,0,0,.88);

    color:white;

    text-align:center;

    opacity:0;

    pointer-events:none;

    transition:.25s;
}

.notice.show{
    opacity:1;
}

/* JOIN */

.overlay{
    position:absolute;

    z-index:300;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.82);
}

.join-box{
    width:86%;
    max-width:340px;

    padding:25px;

    border-radius:18px;

    border:2px solid #d7a83f;

    background:
        linear-gradient(
            145deg,
            #32164d,
            #120b1b
        );

    box-shadow:0 15px 50px #000;

    text-align:center;
}

.join-box h1{
    color:#ffd76a;

    font-size:27px;

    margin-bottom:7px;
}

.join-box p{
    color:#aaa;

    font-size:12px;

    margin-bottom:18px;
}

.join-box input{
    width:100%;

    padding:14px;

    border-radius:10px;

    border:1px solid #9d7027;

    background:#0d0b12;

    color:white;

    outline:none;

    text-align:center;

    font-size:16px;

    margin-bottom:12px;
}

.join-btn{
    width:100%;

    padding:14px;

    border:0;

    border-radius:10px;

    background:
        linear-gradient(
            #ffd86d,
            #a96e13
        );

    color:#241400;

    font-size:16px;

    font-weight:bold;
}

.hidden{
    display:none!important;
}

/* MOBILE */

@media(max-width:420px){

    .table{
        top:25%;
        bottom:14%;
    }

    .p1{
        left:3%;
    }

    .p3{
        right:3%;
    }

    .player{
        width:100px;
    }

    .p2{
        top:150px;
    }

    .action{
        height:48px;
        font-size:9px;
    }

    .actions{
        left:9px;
        right:9px;
        gap:5px;
    }

    .card{
        width:33px;
        height:45px;
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="table">
        <div class="table-logo">
            TEEN PATTI<br>
            GOLD
        </div>
    </div>

    <!-- JOIN -->

    <div id="joinOverlay" class="overlay">

        <div class="join-box">

            <h1>♠ TEEN PATTI ♥</h1>

            <p>
                Join the table and play with friends
            </p>

            <input
                id="nameInput"
                type="text"
                maxlength="14"
                placeholder="Enter your name"
                autocomplete="off"
            >

            <button
                id="joinBtn"
                class="join-btn">
                JOIN TABLE
            </button>

        </div>

    </div>

    <!-- STATUS -->

    <div id="status" class="status">
        Connecting...
    </div>

    <!-- TOP BUTTONS -->

    <div class="top-controls">

        <button
            id="soundBtn"
            class="icon-btn">
            🔊
        </button>

        <button
            id="leaveBtn"
            class="icon-btn">
            ×
        </button>

    </div>

    <!-- DEALER -->

    <div class="dealer">

        <div class="dealer-avatar">
            👩🏻
        </div>

        <div class="dealer-name">
            DEALER
        </div>

    </div>

    <!-- PLAYERS -->

    <div
        id="players"
        class="players">
    </div>

    <!-- POT -->

    <div class="pot">

        <div class="pot-title">
            POT
        </div>

        <div
            id="potValue"
            class="pot-value">
            ₹0
        </div>

        <div class="chips"></div>

    </div>

    <!-- NOTICE -->

    <div
        id="notice"
        class="notice">
    </div>

    <!-- ACTIONS -->

    <div class="actions">

        <button
            id="packBtn"
            class="action">
            PACK
        </button>

        <button
            id="sideBtn"
            class="action">
            SIDE SHOW
        </button>

        <button
            id="chaalBtn"
            class="action gold">
            CHAAL
        </button>

        <button
            id="chaal2Btn"
            class="action gold">
            2X CHAAL
        </button>

        <button
            id="showBtn"
            class="action">
            SHOW
        </button>

    </div>

</div>

<script>
"use strict";

let socket=null;
let myId=null;
let joined=false;

let soundOn=true;
let audioContext=null;

const joinOverlay=
    document.getElementById("joinOverlay");

const joinBtn=
    document.getElementById("joinBtn");

const nameInput=
    document.getElementById("nameInput");

const statusEl=
    document.getElementById("status");

const playersEl=
    document.getElementById("players");

const potValue=
    document.getElementById("potValue");

const noticeEl=
    document.getElementById("notice");

const packBtn=
    document.getElementById("packBtn");

const sideBtn=
    document.getElementById("sideBtn");

const chaalBtn=
    document.getElementById("chaalBtn");

const chaal2Btn=
    document.getElementById("chaal2Btn");

const showBtn=
    document.getElementById("showBtn");

const soundBtn=
    document.getElementById("soundBtn");

const leaveBtn=
    document.getElementById("leaveBtn");


/* =========================
   GAME SOUND
========================= */

function initAudio(){

    if(!audioContext){

        audioContext=
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if(
        audioContext.state==="suspended"
    ){
        audioContext.resume();
    }
}

function playTone(
    frequency,
    duration,
    type="sine"
){

    if(!soundOn) return;

    initAudio();

    const oscillator=
        audioContext.createOscillator();

    const gain=
        audioContext.createGain();

    oscillator.type=type;

    oscillator.frequency.value=
        frequency;

    gain.gain.setValueAtTime(
        .0001,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .1,
        audioContext.currentTime+.01
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioContext.currentTime+
        duration
    );

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime+
        duration
    );
}

function cardSound(){

    playTone(500,.07,"triangle");

    setTimeout(()=>{
        playTone(650,.07,"triangle");
    },90);

}

function chipSound(){

    playTone(850,.05,"square");

    setTimeout(()=>{
        playTone(1100,.05,"square");
    },70);

}

function winSound(){

    playTone(523,.1);

    setTimeout(()=>{
        playTone(659,.1);
    },120);

    setTimeout(()=>{
        playTone(784,.22);
    },240);

}


/* =========================
   NOTICE
========================= */

function showNotice(message){

    noticeEl.textContent=
        message;

    noticeEl.classList.add(
        "show"
    );

    clearTimeout(
        showNotice.timer
    );

    showNotice.timer=
        setTimeout(()=>{
            noticeEl.classList.remove(
                "show"
            );
        },2200);
}


/* =========================
   CONNECTION
========================= */

function setStatus(text){

    statusEl.textContent=
        text;
}

function getSocketURL(){

    return(
        location.protocol==="https:"
        ? "wss://"
        : "ws://"
    )+
    location.host;
}

function connect(){

    if(
        socket &&
        (
            socket.readyState===
            WebSocket.OPEN ||

            socket.readyState===
            WebSocket.CONNECTING
        )
    ){
        return;
    }

    setStatus(
        "Connecting..."
    );

    socket=
        new WebSocket(
            getSocketURL()
        );

    socket.onopen=()=>{

        setStatus(
            "Connected"
        );

        if(joined){

            send({
                type:"join",
                name:
                    nameInput.value.trim()
            });
        }
    };

    socket.onmessage=(event)=>{

        let data;

        try{

            data=
                JSON.parse(
                    event.data
                );

        }catch{

            return;
        }

        handleMessage(data);
    };

    socket.onclose=()=>{

        setStatus(
            "Disconnected"
        );

        if(joined){

            showNotice(
                "Connection lost"
            );
        }

        setTimeout(
            connect,
            2000
        );
    };

    socket.onerror=()=>{

        setStatus(
            "Connection error"
        );
    };
}

function send(data){

    if(
        !socket ||
        socket.readyState!==
        WebSocket.OPEN
    ){

        showNotice(
            "Server not connected"
        );

        return;
    }

    socket.send(
        JSON.stringify(data)
    );
}


/* =========================
   SERVER MESSAGE
========================= */

function handleMessage(data){

    if(
        data.type==="welcome"
    ){

        myId=data.id;

        joinOverlay.classList.add(
            "hidden"
        );

        setStatus(
            "Waiting for players..."
        );

        cardSound();

        return;
    }

    if(
        data.type==="state"
    ){

        renderGame(
            data
        );

        return;
    }

    if(
        data.type==="notice"
    ){

        showNotice(
            data.message || ""
        );

        return;
    }

    if(
        data.type==="result"
    ){

        showNotice(
            data.message ||
            "Round finished"
        );

        winSound();

        return;
    }

    if(
        data.type==="full"
    ){

        showNotice(
            "Table is full"
        );

        return;
    }

    if(
        data.type==="error"
    ){

        showNotice(
            data.message ||
            "Error"
        );

    }
}


/* =========================
   PLAYER POSITION
========================= */

function seatClass(seat){

    const positions=[
        "p0",
        "p1",
        "p2",
        "p3"
    ];

    return(
        positions[
            Number(seat)
        ] || "p0"
    );
}


/* =========================
   RENDER
========================= */

function renderGame(state){

    playersEl.innerHTML="";

    const list=
        state.players || [];

    list.forEach(player=>{

        const box=
            document.createElement(
                "div"
            );

        box.className=
            "player "+
            seatClass(
                player.seat
            );

        if(
            player.id===
            state.turnPlayerId
        ){

            box.classList.add(
                "turn"
            );
        }

        const avatar=
            document.createElement(
                "div"
            );

        avatar.className=
            "avatar";

        avatar.textContent=
            player.id===myId
            ? "👤"
            : "🙂";


        const name=
            document.createElement(
                "div"
            );

        name.className=
            "player-name";

        name.textContent=
            player.name ||
            "Player";


        const money=
            document.createElement(
                "div"
            );

        money.className=
            "player-money";

        money.textContent=
            "₹"+
            Number(
                player.balance || 0
            ).toLocaleString();


        const cards=
            document.createElement(
                "div"
            );

        cards.className=
            "cards";

        const hand=
            player.cards || [];


        for(
            let i=0;
            i<3;
            i++
        ){

            const card=
                document.createElement(
                    "div"
                );

            card.className=
                "card";

            const value=
                hand[i];


            if(value){

                if(
                    value.includes("♥") ||
                    value.includes("♦")
                ){

                    card.classList.add(
                        "red"
                    );
                }

                card.textContent=
                    value;

            }else{

                card.classList.add(
                    "back"
                );
            }

            cards.appendChild(
                card
            );
        }


        box.appendChild(
            avatar
        );

        box.appendChild(
            name
        );

        box.appendChild(
            money
        );

        box.appendChild(
            cards
        );

        playersEl.appendChild(
            box
        );
    });


    potValue.textContent=
        "₹"+
        Number(
            state.pot || 0
        ).toLocaleString();


    const mine=
        list.find(
            p=>p.id===myId
        );


    const myTurn=
        mine &&
        state.phase==="playing" &&
        state.turnPlayerId===myId &&
        !mine.packed;


    packBtn.disabled=
        !myTurn;

    sideBtn.disabled=
        !myTurn;

    chaalBtn.disabled=
        !myTurn;

    chaal2Btn.disabled=
        !myTurn;

    showBtn.disabled=
        !myTurn;


    if(
        state.phase==="playing"
    ){

        setStatus(
            myTurn
            ? "YOUR TURN"
            : "Players "+
              list.length+
              "/4"
        );

    }else{

        setStatus(
            "Players "+
            list.length+
            "/4"
        );
    }
}


/* =========================
   ACTIONS
========================= */

function action(type){

    initAudio();

    chipSound();

    send({
        type:type
    });
}


/* =========================
   JOIN
========================= */

joinBtn.onclick=()=>{

    const name=
        nameInput.value.trim();

    if(!name){

        showNotice(
            "Enter your name"
        );

        nameInput.focus();

        return;
    }

    initAudio();

    joined=true;

    connect();

    if(
        socket.readyState===
        WebSocket.OPEN
    ){

        send({
            type:"join",
            name:name
        });
    }
};


nameInput.onkeydown=(event)=>{

    if(
        event.key==="Enter"
    ){

        joinBtn.click();
    }
};


/* =========================
   BUTTONS
========================= */

packBtn.onclick=()=>{
    action("pack");
};

sideBtn.onclick=()=>{
    action("sideshow");
};

chaalBtn.onclick=()=>{
    action("chaal");
};

chaal2Btn.onclick=()=>{
    action("chaal2");
};

showBtn.onclick=()=>{
    action("show");
};


soundBtn.onclick=()=>{

    soundOn=!soundOn;

    soundBtn.textContent=
        soundOn
        ? "🔊"
        : "🔇";

    if(soundOn){

        initAudio();

        playTone(
            700,
            .08
        );
    }
};


leaveBtn.onclick=()=>{

    if(socket){
        socket.close();
    }

    joined=false;

    joinOverlay.classList.remove(
        "hidden"
    );

    setStatus(
        "Disconnected"
    );
};


/* START */

connect();

</script>
