<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Teen Patti Gold Online</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#071b16;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* =========================
   GAME TABLE
========================= */

.game{
    position:relative;
    width:100vw;
    height:100vh;
    max-width:520px;
    overflow:hidden;

    background:
        radial-gradient(
            ellipse at center,
            #11916e 0%,
            #087457 42%,
            #04503f 72%,
            #02352c 100%
        );

    border-left:5px solid #8b551e;
    border-right:5px solid #8b551e;
}

/* outside border */

.game::before{
    content:"";
    position:absolute;
    inset:14px;
    border:4px solid #a96b26;
    pointer-events:none;
    z-index:1;
}

/* table oval */

.table{
    position:absolute;
    left:4%;
    right:4%;
    top:24%;
    bottom:12%;

    border:9px solid #8a511f;
    border-radius:48%;

    box-shadow:
        inset 0 0 35px rgba(0,0,0,.65),
        0 0 0 5px #392016,
        0 0 30px rgba(0,0,0,.45);

    background:
        radial-gradient(
            ellipse at center,
            #119875 0%,
            #087b5f 48%,
            #05604c 75%,
            #034738 100%
        );

    z-index:2;
}

/* inner table */

.table::after{
    content:"";
    position:absolute;
    left:20%;
    right:20%;
    top:39%;
    bottom:30%;

    border:3px solid rgba(221,201,87,.55);
    border-radius:50%;
}

/* =========================
   DEALER
========================= */

.dealer{
    position:absolute;
    z-index:10;

    top:5%;
    left:50%;

    transform:translateX(-50%);

    width:125px;

    text-align:center;
}

.dealer-photo{
    width:112px;
    height:112px;

    margin:auto;

    border-radius:50%;

    border:6px solid #e8b83f;

    background:
        radial-gradient(circle,#7b173f,#350d24);

    box-shadow:
        0 0 15px rgba(255,205,60,.65),
        inset 0 0 10px rgba(0,0,0,.7);

    overflow:hidden;
}

.dealer-photo img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    object-position:center top;
}

.dealer-name{
    margin-top:5px;
    color:#ffe28a;
    font-size:18px;
    font-weight:900;
    text-shadow:0 2px 4px #000;
}

/* =========================
   TOP BAR
========================= */

.players-count{
    position:absolute;
    z-index:30;

    top:1.2%;
    left:50%;

    transform:translateX(-50%);

    min-width:165px;

    padding:9px 20px;

    border:1px solid #d8ad43;
    border-radius:25px;

    background:rgba(4,14,12,.9);

    color:#fff;

    text-align:center;

    font-size:17px;
    font-weight:700;
}

/* =========================
   TOP BUTTONS
========================= */

.top-buttons{
    position:absolute;
    z-index:40;

    right:3%;
    top:7%;
    
    display:flex;
    gap:8px;
}

.icon-btn{
    width:64px;
    height:64px;

    border:1px solid #d8ad43;
    border-radius:15px;

    background:rgba(4,15,14,.82);

    color:#fff;

    font-size:29px;

    box-shadow:0 3px 10px rgba(0,0,0,.4);
}

/* =========================
   POT
========================= */

.pot{
    position:absolute;
    z-index:15;

    top:49%;
    left:50%;

    transform:translate(-50%,-50%);

    text-align:center;

    color:#fff;
}

.pot-label{
    color:#ffe079;
    font-size:20px;
    font-weight:700;
    letter-spacing:3px;
}

.pot-value{
    margin-top:5px;

    font-size:42px;
    font-weight:900;

    text-shadow:0 3px 5px #000;
}

/* =========================
   CHIP
========================= */

.chip{
    position:absolute;

    left:50%;
    top:57%;

    transform:translate(-50%,-50%);

    width:92px;
    height:92px;

    border-radius:50%;

    background:
        repeating-conic-gradient(
            #fff 0deg 14deg,
            #c92735 14deg 28deg
        );

    border:6px solid #eee;

    box-shadow:
        0 5px 12px rgba(0,0,0,.55);

    z-index:20;
}

.chip::after{
    content:"";

    position:absolute;
    left:21px;
    top:21px;

    width:38px;
    height:38px;

    border-radius:50%;

    background:#d32838;

    border:5px solid #fff;
}

/* =========================
   PLAYER
========================= */

.player{
    position:absolute;
    z-index:25;

    width:150px;

    text-align:center;

    color:#fff;

    text-shadow:0 2px 4px #000;
}

.player-avatar{
    width:72px;
    height:72px;

    margin:auto;

    border-radius:50%;

    border:4px solid #e8b83f;

    background:
        radial-gradient(circle,#ffd84e,#9a6413);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:37px;

    box-shadow:
        0 0 15px rgba(255,218,80,.65);
}

.player-name{
    margin-top:4px;

    font-size:17px;
    font-weight:800;
}

.player-balance{
    margin-top:2px;

    color:#ffe35f;

    font-size:15px;
    font-weight:700;
}

/* positions */

.player-bottom{
    left:50%;
    bottom:12%;

    transform:translateX(-50%);
}

.player-top{
    left:50%;
    top:19%;

    transform:translateX(-50%);
}

.player-left{
    left:2%;
    top:49%;

    transform:translateY(-50%);
}

.player-right{
    right:2%;
    top:49%;

    transform:translateY(-50%);
}

/* =========================
   CARDS
========================= */

.cards{
    display:flex;
    justify-content:center;

    margin-top:8px;
}

.card{
    width:56px;
    height:78px;

    margin-left:-7px;

    border-radius:7px;

    background:#fff;

    border:2px solid #ddd;

    color:#111;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:19px;
    font-weight:900;

    box-shadow:0 4px 8px rgba(0,0,0,.55);
}

.card:first-child{
    margin-left:0;
}

.card.red{
    color:#d21d2b;
}

/* card back */

.card-back{
    width:56px;
    height:78px;

    margin-left:-7px;

    border-radius:7px;

    border:3px solid #e2b53e;

    background:
        repeating-linear-gradient(
            45deg,
            #67122f 0,
            #67122f 7px,
            #92183b 7px,
            #92183b 14px
        );

    display:flex;
    align-items:center;
    justify-content:center;

    color:#ffd44d;

    font-size:24px;

    box-shadow:0 4px 8px rgba(0,0,0,.5);
}

.card-back:first-child{
    margin-left:0;
}

/* =========================
   ACTION BAR
========================= */

.actions{
    position:absolute;
    z-index:50;

    left:2%;
    right:2%;
    bottom:2%;

    display:grid;

    grid-template-columns:
        1fr 1.1fr 1fr 1.1fr 1fr;

    gap:7px;
}

.action{
    height:62px;

    border-radius:15px;

    border:1px solid #d9a932;

    background:
        linear-gradient(
            180deg,
            #3b1855,
            #21102e
        );

    color:#fff;

    font-size:14px;
    font-weight:900;

    box-shadow:
        inset 0 1px rgba(255,255,255,.1),
        0 3px 8px rgba(0,0,0,.45);
}

.action.chaal{
    background:
        linear-gradient(
            180deg,
            #f1c94d,
            #a66d13
        );

    color:#241800;
}

.action:active{
    transform:scale(.96);
}

/* =========================
   STATUS
========================= */

.status{
    position:absolute;
    z-index:60;

    bottom:10%;

    left:50%;

    transform:translateX(-50%);

    padding:5px 16px;

    border-radius:20px;

    background:rgba(0,0,0,.5);

    color:#fff;

    font-size:13px;

    pointer-events:none;
}

/* =========================
   TOAST
========================= */

.toast{
    position:absolute;

    z-index:100;

    left:50%;
    top:15%;

    transform:translateX(-50%);

    padding:9px 17px;

    border-radius:18px;

    background:rgba(0,0,0,.88);

    border:1px solid #e7bd50;

    color:#fff;

    font-weight:800;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    white-space:nowrap;
}

.toast.show{
    opacity:1;
}

/* =========================
   CONNECT SCREEN
========================= */

.connect-screen{
    position:fixed;

    inset:0;

    z-index:500;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            rgba(15,104,78,.95),
            rgba(0,0,0,.97)
        );
}

.connect-box{
    width:min(88vw,420px);

    padding:38px 24px;

    text-align:center;

    border:3px solid #e4b53e;

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            #261338,
            #111722
        );

    box-shadow:
        0 0 40px rgba(0,0,0,.8);
}

.connect-dealer{
    width:125px;
    height:125px;

    margin:auto;

    border-radius:50%;

    border:5px solid #e8b83f;

    overflow:hidden;

    background:#43152c;
}

.connect-dealer img{
    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center top;
}

.connect-title{
    margin-top:20px;

    color:#ffd85d;

    font-size:35px;

    font-weight:900;
}

.connect-sub{
    margin-top:8px;

    color:#ddd;

    font-size:18px;
}

.connect-status{
    margin-top:30px;

    padding:18px;

    border-radius:18px;

    background:
        linear-gradient(
            180deg,
            #f2ca51,
            #ae7417
        );

    color:#201500;

    font-size:21px;

    font-weight:900;
}

/* hide when connected */

.connect-screen.hide{
    display:none;
}

/* =========================
   MOBILE
========================= */

@media(max-width:430px){

    .dealer{
        top:7%;
        width:105px;
    }

    .dealer-photo{
        width:92px;
        height:92px;
    }

    .dealer-name{
        font-size:16px;
    }

    .table{
        top:27%;
        bottom:13%;
    }

    .player{
        width:125px;
    }

    .player-avatar{
        width:64px;
        height:64px;
        font-size:31px;
    }

    .player-name{
        font-size:15px;
    }

    .player-balance{
        font-size:13px;
    }

    .card,
    .card-back{
        width:52px;
        height:72px;
    }

    .pot-value{
        font-size:38px;
    }

    .chip{
        width:82px;
        height:82px;
    }

    .chip::after{
        left:18px;
        top:18px;
    }

    .action{
        height:58px;
        font-size:12px;
    }

    .top-buttons{
        top:8%;
    }

    .icon-btn{
        width:57px;
        height:57px;
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="players-count" id="playersCount">
        Players 0/4
    </div>

    <div class="top-buttons">
        <button class="icon-btn" id="soundBtn">🔊</button>
        <button class="icon-btn" id="exitBtn">×</button>
    </div>

    <!-- DEALER -->

    <div class="dealer">

        <div class="dealer-photo">

            <img
                src="assets/dealer.png"
                alt="Dealer"
                onerror="this.style.display='none';this.parentElement.innerHTML='👩';"
            >

        </div>

        <div class="dealer-name">
            DEALER
        </div>

    </div>

    <!-- TABLE -->

    <div class="table"></div>

    <!-- POT -->

    <div class="pot">

        <div class="pot-label">
            POT
        </div>

        <div class="pot-value" id="pot">
            ₹0
        </div>

    </div>

    <div class="chip"></div>

    <!-- PLAYERS -->

    <div id="players"></div>

    <div class="status" id="status">
        Connecting...
    </div>

    <div class="toast" id="toast"></div>

    <!-- ACTIONS -->

    <div class="actions">

        <button class="action" onclick="gameAction('pack')">
            PACK
        </button>

        <button class="action" onclick="gameAction('sideshow')">
            SIDE SHOW
        </button>

        <button class="action chaal" onclick="gameAction('chaal')">
            CHAAL
        </button>

        <button class="action chaal" onclick="gameAction('chaal2')">
            2X CHAAL
        </button>

        <button class="action" onclick="gameAction('show')">
            SHOW
        </button>

    </div>

</div>


<!-- CONNECTING -->

<div class="connect-screen" id="connectScreen">

    <div class="connect-box">

        <div class="connect-dealer">

            <img
                src="assets/dealer.png"
                alt="Dealer"
                onerror="this.style.display='none';this.parentElement.innerHTML='👩';"
            >

        </div>

        <div class="connect-title">
            TEEN PATTI
        </div>

        <div class="connect-sub">
            GOLD ONLINE TABLE
        </div>

        <div class="connect-status" id="connectStatus">
            CONNECTING...
        </div>

    </div>

</div>


<script>

/* =====================================================
   GAME VARIABLES
===================================================== */

let socket = null;

let myId = null;

let muted = false;

let reconnectTimer = null;


/* =====================================================
   ELEMENTS
===================================================== */

const connectScreen =
    document.getElementById("connectScreen");

const connectStatus =
    document.getElementById("connectStatus");

const status =
    document.getElementById("status");

const playersCount =
    document.getElementById("playersCount");

const playersBox =
    document.getElementById("players");

const potBox =
    document.getElementById("pot");

const toast =
    document.getElementById("toast");

const soundBtn =
    document.getElementById("soundBtn");


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(()=>{
            toast.classList.remove("show");
        },1800);
}


/* =====================================================
   CONNECT
===================================================== */

function connect(){

    if(
        socket &&
        (
            socket.readyState === WebSocket.OPEN ||
            socket.readyState === WebSocket.CONNECTING
        )
    ){
        return;
    }

    connectStatus.textContent =
        "CONNECTING...";

    status.textContent =
        "Connecting...";

    const protocol =
        location.protocol === "https:"
        ? "wss:"
        : "ws:";

    try{

        socket =
            new WebSocket(
                protocol +
                "//" +
                location.host
            );

    }catch(error){

        retryConnection();

        return;
    }


    socket.onopen = function(){

        console.log(
            "WebSocket connected"
        );

        connectStatus.textContent =
            "CONNECTED";

        status.textContent =
            "Connected";

        showToast(
            "Connected to table"
        );

        /*
         * IMPORTANT:
         * server sends welcome after connection.
         */

    };


    socket.onmessage = function(event){

        let data;

        try{

            data =
                JSON.parse(event.data);

        }catch(error){

            return;
        }


        /* =====================
           WELCOME
        ===================== */

        if(data.type === "welcome"){

            myId =
                data.id;

            connectScreen.classList.add(
                "hide"
            );

            showToast(
                "Joined table"
            );

            status.textContent =
                "Waiting for players...";

            return;
        }


        /* =====================
           STATE
        ===================== */

        if(data.type === "state"){

            renderGame(data);

            return;
        }


        /* =====================
           NOTICE
        ===================== */

        if(data.type === "notice"){

            showToast(
                data.text || ""
            );

            return;
        }


        /* =====================
           RESULT
        ===================== */

        if(data.type === "result"){

            showToast(
                (data.winnerName || "Player") +
                " won ₹" +
                (data.pot || 0)
            );

            return;
        }


        /* =====================
           FULL
        ===================== */

        if(data.type === "full"){

            connectStatus.textContent =
                "TABLE FULL";

            status.textContent =
                "Table full";

            showToast(
                "Table is full"
            );

            return;
        }


        /* =====================
           ERROR
        ===================== */

        if(data.type === "error"){

            showToast(
                data.text || "Game error"
            );

        }

    };


    socket.onerror = function(){

        console.log(
            "WebSocket error"
        );

        connectStatus.textContent =
            "RECONNECTING...";

    };


    socket.onclose = function(){

        status.textContent =
            "Disconnected";

        connectStatus.textContent =
            "RECONNECTING...";

        /*
         * Automatically reconnect.
         */

        retryConnection();

    };

}


/* =====================================================
   RETRY
===================================================== */

function retryConnection(){

    clearTimeout(
        reconnectTimer
    );

    reconnectTimer =
        setTimeout(
            connect,
            2000
        );

}


/* =====================================================
   RENDER GAME
===================================================== */

function renderGame(state){

    const list =
        state.players || [];

    playersCount.textContent =
        "Players " +
        list.length +
        "/4";


    potBox.textContent =
        "₹" +
        Number(
            state.pot || 0
        ).toLocaleString();


    playersBox.innerHTML = "";


    /*
     * Four fixed seats
     */

    list.forEach(function(player){

        let className =
            "player ";

        if(player.seat === 0){

            className +=
                "player-bottom";

        }else if(player.seat === 1){

            className +=
                "player-left";

        }else if(player.seat === 2){

            className +=
                "player-top";

        }else{

            className +=
                "player-right";

        }


        const div =
            document.createElement(
                "div"
            );

        div.className =
            className;


        const isMe =
            player.id === myId;


        /*
         * Only own cards are visible
         * during the round.
         */

        const cards =
            (
                isMe ||
                state.phase === "finished"
            )
            ? (player.cards || [])
            : null;


        let cardsHTML = "";


        if(cards){

            cards.forEach(function(card){

                let red =
                    card.suit === "♥" ||
                    card.suit === "♦";


                cardsHTML +=
                    `<div class="card ${red ? "red" : ""}">
                        ${card.rank}${card.suit}
                    </div>`;

            });

        }else{

            cardsHTML =
                `
                <div class="card-back">♠</div>
                <div class="card-back">♠</div>
                <div class="card-back">♠</div>
                `;

        }


        div.innerHTML = `

            <div class="player-avatar">
                ${isMe ? "👤" : "🙂"}
            </div>

            <div class="player-name">
                ${escapeHTML(
                    player.name || "Player"
                )}
            </div>

            <div class="player-balance">
                ₹${Number(
                    player.balance || 0
                ).toLocaleString()}
            </div>

            <div class="cards">
                ${cardsHTML}
            </div>

        `;


        playersBox.appendChild(
            div
        );

    });


    /* =====================
       STATUS
    ===================== */

    if(state.turn === myId){

        status.textContent =
            "YOUR TURN";

    }else if(
        state.phase === "waiting"
    ){

        status.textContent =
            "Waiting for players...";

    }else if(
        state.phase === "finished"
    ){

        status.textContent =
            "Round finished";

    }else{

        status.textContent =
            "Waiting...";
    }

}


/* =====================================================
   ACTION
===================================================== */

function gameAction(action){

    if(
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ){

        showToast(
            "Connecting..."
        );

        return;
    }


    socket.send(
        JSON.stringify({

            type:"action",

            action:action

        })
    );

}


/* =====================================================
   SOUND
===================================================== */

soundBtn.onclick =
function(){

    muted =
        !muted;

    soundBtn.textContent =
        muted
        ? "🔇"
        : "🔊";

    showToast(
        muted
        ? "Sound OFF"
        : "Sound ON"
    );

};


/* =====================================================
   EXIT
===================================================== */

document
.getElementById("exitBtn")
.onclick =
function(){

    if(
        socket &&
        socket.readyState === WebSocket.OPEN
    ){

        socket.close();

    }

    connectScreen.classList.remove(
        "hide"
    );

    connectStatus.textContent =
        "CONNECTING...";

    connect();

};


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================================
   AUTO START
===================================================== */

/*
 * No JOIN button.
 * Page automatically connects.
 */

window.addEventListener(
    "load",
    function(){

        setTimeout(
            connect,
            300
        );

    }
);

</script>

</body>
</html>
