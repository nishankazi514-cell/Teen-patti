<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Teen Patti Gold — Online</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

.stage{
    position:relative;
    width:min(100vw,100vh * 2.16);
    aspect-ratio:1080/500;
    overflow:hidden;

    background:
        #221238
        url("assets/reference-game.jpg")
        center/cover
        no-repeat;

    box-shadow:0 0 35px #000;
}

.stage:after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.05),
            transparent 35%,
            rgba(0,0,0,.08)
        );
}

.hit{
    position:absolute;
    border:0;
    background:transparent;
    cursor:pointer;
    z-index:20;
    touch-action:manipulation;
}

.sound{
    right:2.4%;
    top:4%;
    width:4%;
    height:10%;
}

.pack{
    left:14.5%;
    bottom:1.5%;
    width:7.2%;
    height:16%;
}

.side{
    left:22.5%;
    bottom:1.5%;
    width:8.2%;
    height:16%;
}

.chaal{
    left:50.8%;
    bottom:1.5%;
    width:8.2%;
    height:16%;
}

.chaal2{
    left:59.5%;
    bottom:1.5%;
    width:9%;
    height:16%;
}

.showBtn{
    left:68.8%;
    bottom:1.5%;
    width:8.5%;
    height:16%;
}

.toast{
    position:absolute;
    z-index:50;
    left:50%;
    top:8%;
    transform:translateX(-50%);

    padding:7px 15px;

    border:1px solid #e8bd55;
    border-radius:14px;

    background:rgba(22,10,33,.94);
    color:#fff;

    font-weight:700;
    font-size:clamp(10px,1.4vw,16px);

    opacity:0;
    transition:.2s;

    pointer-events:none;
    white-space:nowrap;
}

.toast.show{
    opacity:1;
}

.status{
    position:absolute;
    z-index:25;
    left:50%;
    bottom:2%;
    transform:translateX(-50%);

    min-width:15%;

    text-align:center;

    color:#fff;
    font-weight:800;
    font-size:clamp(11px,1.7vw,18px);

    text-shadow:0 1px 3px #000;

    pointer-events:none;
}

.players{
    position:absolute;
    inset:0;
    z-index:15;
    pointer-events:none;
}

.p{
    position:absolute;

    min-width:82px;

    text-align:center;

    color:#fff;

    text-shadow:0 1px 4px #000;

    font-size:clamp(9px,1.2vw,14px);

    font-weight:800;
}

.p .avatar{
    width:44px;
    height:44px;

    margin:auto;

    border-radius:50%;

    border:2px solid #f4c84b;

    background:rgba(30,10,45,.9);

    display:grid;
    place-items:center;
}

.p .cards{
    margin-top:3px;

    display:flex;
    justify-content:center;

    gap:2px;
}

.card{
    width:24px;
    height:34px;

    border-radius:4px;

    background:#fff;
    color:#111;

    display:grid;
    place-items:center;

    font-size:9px;
    font-weight:900;

    box-shadow:0 1px 5px #000;
}

.me{
    left:50%;
    bottom:21%;
    transform:translateX(-50%);
}

.top{
    left:50%;
    top:9%;
    transform:translateX(-50%);
}

.leftp{
    left:6%;
    top:43%;
    transform:translateY(-50%);
}

.rightp{
    right:6%;
    top:43%;
    transform:translateY(-50%);
}

/* JOIN OVERLAY */

.start{
    position:fixed;
    inset:0;

    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.72);

    color:white;

    padding:20px;
}

.startBox{
    width:min(90vw,500px);

    padding:28px 24px;

    border:2px solid #f4c84b;
    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            #24133c,
            #101722
        );

    box-shadow:
        0 0 30px rgba(244,200,75,.25),
        0 15px 50px rgba(0,0,0,.65);

    text-align:center;
}

.startLogo{
    width:130px;
    height:130px;

    margin:0 auto 18px;

    border-radius:50%;

    border:6px solid #f4c84b;

    background:
        url("assets/reference-game.jpg")
        center/cover
        no-repeat;

    box-shadow:
        0 0 25px rgba(244,200,75,.35);
}

.startTitle{
    color:#ffd85c;

    font-size:clamp(30px,7vw,54px);

    font-weight:900;

    letter-spacing:1px;

    margin-bottom:5px;
}

.startSub{
    color:#ddd;

    font-size:clamp(14px,3vw,21px);

    margin-bottom:25px;
}

.nameInput{
    width:100%;

    height:58px;

    padding:0 18px;

    border-radius:16px;

    border:1px solid #d3ad42;

    outline:none;

    background:#070d12;

    color:#fff;

    font-size:18px;

    text-align:center;
}

.nameInput:focus{
    border-color:#ffd85c;

    box-shadow:
        0 0 0 2px rgba(255,216,92,.15);
}

.joinBtn{
    width:100%;

    height:62px;

    margin-top:18px;

    border:0;

    border-radius:17px;

    background:
        linear-gradient(
            #ffd85c,
            #d99a18
        );

    color:#171717;

    font-size:20px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 5px 15px rgba(0,0,0,.35);

    touch-action:manipulation;

    transition:
        transform .12s,
        filter .12s;
}

.joinBtn:active{
    transform:scale(.97);
}

.joinBtn:disabled{
    opacity:.65;
    cursor:wait;
}

.joinStatus{
    min-height:22px;

    margin-top:12px;

    color:#ffd85c;

    font-size:13px;
}

/* CONNECTION ERROR */

.retryBtn{
    display:none;

    margin:10px auto 0;

    padding:10px 20px;

    border:1px solid #f4c84b;
    border-radius:10px;

    background:#2b0b45;

    color:#fff;

    font-weight:800;
}

/* MOBILE */

@media (max-aspect-ratio:1/1){

    html,
    body{
        width:100%;
        height:100%;
        overflow:hidden;
        background:#07140f;
    }

    body{
        display:block;
    }

    .stage{
        position:fixed;
        inset:0;

        width:100vw;
        height:100vh;

        max-width:none;
        max-height:none;

        aspect-ratio:auto;

        overflow:hidden;

        background:
            #07140f
            url("assets/reference-game.jpg")
            center center / cover
            no-repeat;

        box-shadow:none;
    }

    .stage:after{
        background:
            linear-gradient(
                180deg,
                rgba(0,0,0,.12),
                transparent 35%,
                rgba(0,0,0,.18)
            );
    }

    .players{
        position:absolute;
        inset:0;
    }

    /* YOUR PLAYER */

    .me{
        left:50%;
        bottom:14%;
        transform:translateX(-50%);
    }

    /* TOP PLAYER / DEALER AREA */

    .top{
        left:50%;
        top:10%;
        transform:translateX(-50%);
    }

    /* LEFT PLAYER */

    .leftp{
        left:5%;
        top:45%;
        transform:translateY(-50%);
    }

    /* RIGHT PLAYER */

    .rightp{
        right:5%;
        top:45%;
        transform:translateY(-50%);
    }

    .p{
        min-width:90px;

        font-size:12px;

        text-shadow:
            0 2px 5px #000;
    }

    .p .avatar{
        width:58px;
        height:58px;

        border-width:3px;
    }

    .card{
        width:29px;
        height:40px;

        font-size:10px;
    }

    .status{
        left:50%;
        bottom:8%;

        min-width:180px;

        font-size:14px;
    }

    .toast{
        top:5%;

        max-width:85vw;

        font-size:13px;
    }

    /*
       MOBILE BUTTON AREA
    */

    .pack{
        left:2%;
        bottom:1%;
        width:18%;
        height:9%;
    }

    .side{
        left:21%;
        bottom:1%;
        width:18%;
        height:9%;
    }

    .chaal{
        left:40%;
        bottom:1%;
        width:18%;
        height:9%;
    }

    .chaal2{
        left:59%;
        bottom:1%;
        width:18%;
        height:9%;
    }

    .showBtn{
        left:78%;
        bottom:1%;
        width:20%;
        height:9%;
    }

    /*
       JOIN SCREEN
    */

    .start{
        position:fixed;
        inset:0;

        width:100vw;
        height:100vh;

        padding:15px;

        display:flex;

        align-items:center;
        justify-content:center;
    }

    .startBox{
        width:92vw;
        max-width:430px;

        max-height:92vh;

        overflow:auto;

        padding:24px 18px;

        border-radius:22px;
    }

    .startLogo{
        width:110px;
        height:110px;

        margin-bottom:14px;
    }

    .startTitle{
        font-size:34px;
    }

    .startSub{
        font-size:15px;

        margin-bottom:20px;
    }

    .nameInput{
        height:54px;

        font-size:17px;
    }

    .joinBtn{
        height:58px;

        font-size:19px;
    }
}

    .startBox{
        width:min(88vw,430px);
        padding:25px 20px;
    }

    .startLogo{
        width:115px;
        height:115px;
    }

    .joinBtn{
        height:60px;
    }
}
</style>
</head>

<body>

<div class="stage" id="stage">

    <button
        class="hit sound"
        id="soundBtn"
        aria-label="Toggle sound">
    </button>

    <button
        class="hit pack"
        id="packBtn"
        aria-label="Pack">
    </button>

    <button
        class="hit side"
        id="sideBtn"
        aria-label="Side Show">
    </button>

    <button
        class="hit chaal"
        id="chaalBtn"
        aria-label="Chaal">
    </button>

    <button
        class="hit chaal2"
        id="chaal2Btn"
        aria-label="Chaal 2x">
    </button>

    <button
        class="hit showBtn"
        id="showBtn"
        aria-label="Show">
    </button>

    <div
        class="players"
        id="players">
    </div>

    <div
        class="toast"
        id="toast">
    </div>

    <div
        class="status"
        id="status">
        Ready
    </div>

</div>


<!-- JOIN SCREEN -->

<div
    class="start"
    id="start">

    <div class="startBox">

        <div class="startLogo"></div>

        <div class="startTitle">
            TEEN PATTI
        </div>

        <div class="startSub">
            GOLD ONLINE TABLE
        </div>

        <input
            id="playerName"
            class="nameInput"
            type="text"
            maxlength="18"
            autocomplete="off"
            placeholder="Enter your name"
            value="Nishan"
        >

        <button
            id="startBtn"
            class="joinBtn"
            type="button">
            JOIN TABLE
        </button>

        <div
            id="joinStatus"
            class="joinStatus">
        </div>

        <button
            id="retryBtn"
            class="retryBtn"
            type="button">
            RETRY
        </button>

    </div>

</div>


<audio
    id="bgAudio"
    src="assets/reference-audio.mp3"
    preload="auto"
    loop>
</audio>


<script>

"use strict";


/* =========================
   ELEMENTS
========================= */

const audio =
    document.getElementById("bgAudio");

const start =
    document.getElementById("start");

const startBtn =
    document.getElementById("startBtn");

const retryBtn =
    document.getElementById("retryBtn");

const playerName =
    document.getElementById("playerName");

const joinStatus =
    document.getElementById("joinStatus");

const toast =
    document.getElementById("toast");

const status =
    document.getElementById("status");

const playersEl =
    document.getElementById("players");


/* =========================
   VARIABLES
========================= */

let muted = false;

let me = null;

let ws = null;

let connecting = false;

let joinTimer = null;


/* =========================
   TOAST
========================= */

function say(text){

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(say.timer);

    say.timer = setTimeout(() => {

        toast.classList.remove("show");

    }, 1600);
}


/* =========================
   SAFE SEND
========================= */

function send(action){

    if(
        ws &&
        ws.readyState === WebSocket.OPEN
    ){

        ws.send(
            JSON.stringify({
                type:"action",
                action:action
            })
        );

    }else{

        say("Not connected");

    }
}


/* =========================
   CARD
========================= */

function cardText(card){

    if(!card){
        return "";
    }

    return (
        String(card.rank || "") +
        String(card.suit || "")
    );
}


/* =========================
   RENDER
========================= */

function render(state){

    if(!state){
        return;
    }

    playersEl.innerHTML = "";

    const positions = [
        "me",
        "top",
        "leftp",
        "rightp"
    ];

    if(Array.isArray(state.players)){

        state.players.forEach(
            (p,index) => {

                const d =
                    document.createElement("div");

                d.className =
                    "p " +
                    (
                        positions[p.seat] ||
                        positions[index] ||
                        "top"
                    );

                const mine =
                    p.id === me;

                const cards =
                    (
                        mine ||
                        state.phase === "finished"
                    )
                    ? (p.cards || [])
                    : [];

                d.innerHTML = `

                    <div class="avatar">
                        ${Number(p.seat || 0) + 1}
                    </div>

                    <div>
                        ${escapeHtml(p.name || "Player")}
                        ${
                            p.packed
                            ? " — PACKED"
                            : ""
                        }
                    </div>

                    <div>
                        ${Number(
                            p.balance || 0
                        ).toLocaleString()}
                    </div>

                    <div class="cards">

                        ${cards.map(
                            card => `
                                <div class="card">
                                    ${cardText(card)}
                                </div>
                            `
                        ).join("")}

                    </div>
                `;

                playersEl.appendChild(d);

            }
        );

    }


    if(state.turn === me){

        status.textContent =
            "YOUR TURN";

    }
    else if(state.phase === "waiting"){

        const connected =
            Array.isArray(state.players)
            ? state.players.filter(
                p => p.connected
            ).length
            : 0;

        status.textContent =
            `Waiting for players (${connected}/4)`;

    }
    else if(state.phase === "finished"){

        status.textContent =
            `Round finished • Pot ${state.pot || 0}`;

    }
    else{

        status.textContent =
            `Pot ${state.pot || 0} • Waiting`;

    }

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   CONNECT
========================= */

function connect(){

    if(connecting){
        return;
    }

    if(
        ws &&
        (
            ws.readyState === WebSocket.OPEN ||
            ws.readyState === WebSocket.CONNECTING
        )
    ){
        return;
    }

    connecting = true;

    clearTimeout(joinTimer);

    startBtn.disabled = true;

    retryBtn.style.display = "none";

    joinStatus.textContent =
        "Connecting to table...";

    status.textContent =
        "Connecting...";


    const protocol =
        location.protocol === "https:"
        ? "wss:"
        : "ws:";


    const socketUrl =
        `${protocol}//${location.host}`;


    try{

        ws = new WebSocket(socketUrl);

    }catch(error){

        handleConnectionError(
            "Connection could not start"
        );

        return;

    }


    /*
       IMPORTANT:
       Give Render/WebSocket enough time.
    */

    joinTimer = setTimeout(() => {

        if(
            !ws ||
            ws.readyState !== WebSocket.OPEN
        ){

            try{
                ws.close();
            }catch(e){}

            handleConnectionError(
                "Server connection timed out"
            );

        }

    },10000);


    ws.onopen = () => {

        connecting = false;

        clearTimeout(joinTimer);

        status.textContent =
            "Connected";

        joinStatus.textContent =
            "Joining table...";


        /*
           The current server automatically creates
           the player when WebSocket connects.
        */

        say("Connected");


        /*
           Keep browser audio permission alive.
        */

        audio.muted = muted;

        audio.play().catch(() => {});

    };


    ws.onmessage = event => {

        let message;

        try{

            message =
                JSON.parse(event.data);

        }catch(error){

            return;

        }


        if(message.type === "welcome"){

            me = message.id;

            connecting = false;

            clearTimeout(joinTimer);

            start.style.display = "none";

            startBtn.disabled = false;

            joinStatus.textContent = "";

            status.textContent =
                "Joined table";

            say("Joined table");

            audio.play().catch(() => {});

            return;
        }


        if(message.type === "state"){

            render(message);

            return;
        }


        if(message.type === "notice"){

            say(message.text || "");

            return;
        }


        if(message.type === "result"){

            say(
                `${message.winnerName || "Player"} won ${message.pot || 0}`
            );

            return;
        }


        if(message.type === "full"){

            connecting = false;

            startBtn.disabled = false;

            status.textContent =
                "Table full";

            joinStatus.textContent =
                "Table is full. Try again later.";

            start.style.display = "flex";

            say("Table is full");

            return;
        }


        if(message.type === "error"){

            say(
                message.text ||
                "Game error"
            );

            return;
        }

    };


    ws.onerror = () => {

        handleConnectionError(
            "Unable to connect to game server"
        );

    };


    ws.onclose = () => {

        clearTimeout(joinTimer);

        connecting = false;

        startBtn.disabled = false;

        if(me){

            status.textContent =
                "Disconnected";

            say("Server disconnected");

        }else{

            handleConnectionError(
                "Server connection failed"
            );

        }

    };

}


/* =========================
   CONNECTION ERROR
========================= */

function handleConnectionError(message){

    clearTimeout(joinTimer);

    connecting = false;

    startBtn.disabled = false;

    status.textContent =
        "Connection failed";

    joinStatus.textContent =
        message;

    retryBtn.style.display =
        "block";

    start.style.display =
        "flex";

    say(message);

}


/* =========================
   JOIN BUTTON
========================= */

function joinTable(){

    if(connecting){
        return;
    }


    /*
       Prevent blank name.
    */

    const name =
        playerName.value.trim();


    if(!name){

        playerName.value =
            "Nishan";

    }


    /*
       IMPORTANT FIX:
       UI immediately enters connecting state.
       It no longer looks like the JOIN button
       did nothing while waiting for WebSocket.
    */

    startBtn.disabled = true;

    startBtn.textContent =
        "CONNECTING...";

    joinStatus.textContent =
        "Connecting to table...";

    status.textContent =
        "Connecting...";


    connect();


    setTimeout(() => {

        if(!connecting){

            startBtn.textContent =
                "JOIN TABLE";

        }

    },300);

}


/* =========================
   JOIN CLICK
========================= */

startBtn.addEventListener(
    "click",
    joinTable,
    {
        passive:true
    }
);


/* =========================
   RETRY
========================= */

retryBtn.addEventListener(
    "click",
    () => {

        retryBtn.style.display =
            "none";

        startBtn.textContent =
            "JOIN TABLE";

        joinTable();

    },
    {
        passive:true
    }
);


/* =========================
   ENTER KEY
========================= */

playerName.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            event.preventDefault();

            joinTable();

        }

    }
);


/* =========================
   SOUND
========================= */

document
.getElementById("soundBtn")
.addEventListener(
    "click",
    () => {

        muted = !muted;

        audio.muted = muted;

        say(
            muted
            ? "Sound off"
            : "Sound on"
        );

        if(!muted){

            audio.play().catch(() => {});

        }

    }
);


/* =========================
   GAME BUTTONS
========================= */

document
.getElementById("packBtn")
.addEventListener(
    "click",
    () => send("pack")
);


document
.getElementById("sideBtn")
.addEventListener(
    "click",
    () => send("sideshow")
);


document
.getElementById("chaalBtn")
.addEventListener(
    "click",
    () => send("chaal")
);


document
.getElementById("chaal2Btn")
.addEventListener(
    "click",
    () => send("chaal2")
);


document
.getElementById("showBtn")
.addEventListener(
    "click",
    () => send("show")
);


/* =========================
   INITIAL STATE
========================= */

status.textContent =
    "Ready";

</script>

</body>
  </html>
