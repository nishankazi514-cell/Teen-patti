<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Teen Patti Gold Online</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#06120e;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    position:relative;
}


/* =========================
   GAME
========================= */

.stage{

    position:fixed;

    inset:0;

    width:100vw;
    height:100vh;

    overflow:hidden;

    background:
        #06120e
        url("assets/reference-game.jpg")
        center center / cover
        no-repeat;

}


/* DARK LAYER */

.stage::after{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    background:

        radial-gradient(
            ellipse at center,
            rgba(10,70,45,.05),
            rgba(0,0,0,.38)
        );

    z-index:1;

}


/* =========================
   TOP HEADER
========================= */

.topBar{

    position:absolute;

    left:50%;

    top:2.5%;

    transform:translateX(-50%);

    z-index:20;

    width:min(88vw,600px);

    display:flex;

    justify-content:center;

}


.tableInfo{

    padding:8px 18px;

    border-radius:18px;

    border:1px solid rgba(246,205,79,.65);

    background:rgba(10,18,17,.70);

    color:#ffd85c;

    font-size:13px;

    font-weight:900;

    text-align:center;

}


/* =========================
   DEALER
========================= */

.dealer{

    position:absolute;

    z-index:10;

    left:50%;

    top:9%;

    transform:translateX(-50%);

    width:100px;

    text-align:center;

    pointer-events:none;

}


.dealerAvatar{

    width:78px;

    height:78px;

    margin:auto;

    border-radius:50%;

    border:4px solid #f4c84b;

    background:

        url("assets/reference-game.jpg")
        center 20% / 260% auto
        no-repeat;

    box-shadow:

        0 0 18px rgba(244,200,75,.42),

        inset 0 0 12px rgba(0,0,0,.5);

}


.dealerName{

    margin-top:5px;

    color:#f7d45b;

    font-weight:900;

    font-size:13px;

    text-shadow:0 2px 5px #000;

}


/* =========================
   TABLE
========================= */

.table{

    position:absolute;

    z-index:5;

    left:50%;

    top:52%;

    transform:translate(-50%,-50%);

    width:min(84vw,760px);

    height:min(46vh,390px);

    border-radius:50%;

    border:5px solid rgba(221,174,48,.72);

    background:

        radial-gradient(
            ellipse,
            rgba(10,91,61,.80),
            rgba(3,47,32,.86)
        );

    box-shadow:

        0 0 0 10px rgba(35,20,7,.42),

        0 0 50px rgba(0,0,0,.65),

        inset 0 0 45px rgba(0,0,0,.55);

}


.tableInner{

    position:absolute;

    inset:8%;

    border-radius:50%;

    border:2px solid rgba(246,205,79,.24);

}


/* =========================
   POT
========================= */

.pot{

    position:absolute;

    left:50%;

    top:50%;

    transform:translate(-50%,-50%);

    min-width:120px;

    padding:8px 20px;

    border-radius:20px;

    border:1px solid rgba(246,205,79,.7);

    background:rgba(0,0,0,.32);

    color:#ffd85c;

    text-align:center;

    font-size:15px;

    font-weight:900;

    text-shadow:0 2px 4px #000;

}


/* =========================
   PLAYERS
========================= */

.players{

    position:absolute;

    inset:0;

    z-index:30;

    pointer-events:none;

}


.player{

    position:absolute;

    width:125px;

    text-align:center;

    color:#fff;

    font-size:13px;

    font-weight:800;

    text-shadow:0 2px 5px #000;

}


.playerAvatar{

    width:58px;

    height:58px;

    margin:auto;

    display:grid;

    place-items:center;

    border-radius:50%;

    border:3px solid #f4c84b;

    background:

        radial-gradient(
            circle,
            #3c1d57,
            #130b1b
        );

    color:#fff;

    font-size:19px;

    font-weight:900;

    box-shadow:

        0 0 14px rgba(244,200,75,.25);

}


.playerName{

    margin-top:3px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.playerBalance{

    color:#f4d56c;

    font-size:12px;

}


.cards{

    display:flex;

    justify-content:center;

    gap:3px;

    margin-top:4px;

}


.card{

    width:28px;

    height:39px;

    border-radius:5px;

    background:#fff;

    color:#111;

    display:grid;

    place-items:center;

    font-size:10px;

    font-weight:900;

    box-shadow:0 2px 7px #000;

}


/* PLAYER POSITIONS */

.p0{

    left:50%;

    bottom:13%;

    transform:translateX(-50%);

}


.p1{

    left:50%;

    top:26%;

    transform:translateX(-50%);

}


.p2{

    left:4%;

    top:50%;

    transform:translateY(-50%);

}


.p3{

    right:4%;

    top:50%;

    transform:translateY(-50%);

}


/* =========================
   TURN
========================= */

.turnGlow{

    animation:turnPulse 1s infinite;

}


@keyframes turnPulse{

    0%{
        box-shadow:
            0 0 8px rgba(255,216,92,.2);
    }

    50%{
        box-shadow:
            0 0 28px rgba(255,216,92,.85);
    }

    100%{
        box-shadow:
            0 0 8px rgba(255,216,92,.2);
    }

}


/* =========================
   STATUS
========================= */

.status{

    position:absolute;

    z-index:50;

    left:50%;

    bottom:10%;

    transform:translateX(-50%);

    min-width:190px;

    padding:7px 14px;

    border-radius:18px;

    background:rgba(0,0,0,.55);

    color:#fff;

    text-align:center;

    font-size:13px;

    font-weight:900;

    text-shadow:0 2px 4px #000;

}


/* =========================
   BUTTONS
========================= */

.controls{

    position:absolute;

    z-index:100;

    left:50%;

    bottom:1.5%;

    transform:translateX(-50%);

    width:min(98vw,700px);

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:5px;

}


.gameBtn{

    height:48px;

    border-radius:12px 12px 0 0;

    border:1px solid rgba(246,205,79,.65);

    background:
        linear-gradient(
            #151a19,
            #080c0b
        );

    color:#fff;

    font-size:11px;

    font-weight:900;

    box-shadow:
        0 -2px 10px rgba(0,0,0,.3);

    touch-action:manipulation;

}


.gameBtn.chaal{

    background:
        linear-gradient(
            #f5d45c,
            #bd8515
        );

    color:#151515;

}


/* SOUND */

.soundBtn{

    position:absolute;

    z-index:200;

    top:3%;

    right:3%;

    width:48px;

    height:48px;

    border-radius:15px;

    border:1px solid #d9b747;

    background:rgba(15,20,19,.78);

    color:#fff;

    font-size:21px;

}


/* =========================
   TOAST
========================= */

.toast{

    position:absolute;

    z-index:500;

    left:50%;

    top:8%;

    transform:translateX(-50%);

    padding:8px 15px;

    border-radius:15px;

    border:1px solid #e8bd55;

    background:rgba(15,12,20,.94);

    color:#fff;

    font-size:13px;

    font-weight:800;

    opacity:0;

    pointer-events:none;

    white-space:nowrap;

    transition:.2s;

}


.toast.show{

    opacity:1;

}


/* =========================
   JOIN SCREEN
========================= */

.start{

    position:fixed;

    z-index:1000;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:16px;

    background:
        rgba(0,0,0,.76);

}


.startBox{

    width:min(92vw,430px);

    padding:24px 20px;

    border-radius:24px;

    border:3px solid #f4c84b;

    background:

        linear-gradient(
            145deg,
            #25133e,
            #10151b
        );

    box-shadow:

        0 0 30px rgba(244,200,75,.25),

        0 20px 70px rgba(0,0,0,.7);

    text-align:center;

}


.startLogo{

    width:115px;

    height:115px;

    margin:0 auto 15px;

    border-radius:50%;

    border:5px solid #f4c84b;

    background:

        url("assets/reference-game.jpg")
        center 20% / 250% auto
        no-repeat;

    box-shadow:
        0 0 25px rgba(244,200,75,.35);

}


.startTitle{

    color:#ffd85c;

    font-size:36px;

    font-weight:900;

    letter-spacing:1px;

}


.startSub{

    margin-top:3px;

    margin-bottom:20px;

    color:#ddd;

    font-size:15px;

}


.nameInput{

    width:100%;

    height:55px;

    padding:0 15px;

    border-radius:15px;

    border:1px solid #d3ad42;

    outline:none;

    background:#070d12;

    color:#fff;

    font-size:17px;

    text-align:center;

}


.joinBtn{

    width:100%;

    height:58px;

    margin-top:16px;

    border:0;

    border-radius:16px;

    background:

        linear-gradient(
            #ffd85c,
            #d99a18
        );

    color:#171717;

    font-size:19px;

    font-weight:900;

    touch-action:manipulation;

}


.joinBtn:disabled{

    opacity:.65;

}


.joinStatus{

    min-height:20px;

    margin-top:10px;

    color:#ffd85c;

    font-size:13px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .table{

        width:94vw;

        height:45vh;

        top:53%;

        border-width:4px;

    }


    .tableInner{

        inset:7%;

    }


    .dealer{

        top:5%;

        width:85px;

    }


    .dealerAvatar{

        width:64px;

        height:64px;

    }


    .dealerName{

        font-size:11px;

    }


    .player{

        width:100px;

        font-size:11px;

    }


    .playerAvatar{

        width:52px;

        height:52px;

        font-size:17px;

    }


    .card{

        width:24px;

        height:34px;

        font-size:9px;

    }


    .p0{

        bottom:13%;

    }


    .p1{

        top:25%;

    }


    .p2{

        left:1%;

        top:51%;

    }


    .p3{

        right:1%;

        top:51%;

    }


    .status{

        bottom:9%;

        font-size:12px;

        min-width:170px;

    }


    .controls{

        width:98vw;

        gap:3px;

    }


    .gameBtn{

        height:43px;

        font-size:9px;

        border-radius:9px 9px 0 0;

    }


    .soundBtn{

        width:42px;

        height:42px;

        top:2%;

        right:2%;

    }


    .startBox{

        width:92vw;

        padding:22px 17px;

    }


    .startLogo{

        width:105px;

        height:105px;

    }


    .startTitle{

        font-size:32px;

    }

}


/* VERY SMALL PHONES */

@media(max-height:700px){

    .dealer{

        top:3%;

    }


    .dealerAvatar{

        width:55px;

        height:55px;

    }


    .table{

        height:42vh;

        top:51%;

    }


    .p0{

        bottom:11%;

    }


    .controls{

        bottom:0;

    }

}

</style>

</head>

<body>


<div
    class="stage"
    id="stage"
>


    <!-- TOP -->

    <div class="topBar">

        <div
            class="tableInfo"
            id="tableInfo"
        >
            PLAYERS 0/4
        </div>

    </div>


    <!-- SOUND -->

    <button
        class="soundBtn"
        id="soundBtn"
        type="button"
    >
        🔊
    </button>


    <!-- DEALER -->

    <div class="dealer">

        <div
            class="dealerAvatar"
        ></div>

        <div class="dealerName">
            DEALER
        </div>

    </div>


    <!-- TABLE -->

    <div class="table">

        <div class="tableInner"></div>

        <div
            class="pot"
            id="pot"
        >
            POT 0
        </div>

    </div>


    <!-- PLAYERS -->

    <div
        class="players"
        id="players"
    ></div>


    <!-- STATUS -->

    <div
        class="status"
        id="status"
    >
        Waiting for players
    </div>


    <!-- CONTROLS -->

    <div class="controls">

        <button
            class="gameBtn"
            id="packBtn"
            type="button"
        >
            PACK
        </button>

        <button
            class="gameBtn"
            id="sideBtn"
            type="button"
        >
            SIDE SHOW
        </button>

        <button
            class="gameBtn chaal"
            id="chaalBtn"
            type="button"
        >
            CHAAL
        </button>

        <button
            class="gameBtn chaal"
            id="chaal2Btn"
            type="button"
        >
            2X CHAAL
        </button>

        <button
            class="gameBtn"
            id="showBtn"
            type="button"
        >
            SHOW
        </button>

    </div>


    <!-- TOAST -->

    <div
        class="toast"
        id="toast"
    ></div>

</div>


<!-- JOIN -->

<div
    class="start"
    id="start"
>

    <div class="startBox">

        <div
            class="startLogo"
        ></div>

        <div class="startTitle">
            TEEN PATTI
        </div>

        <div class="startSub">
            GOLD ONLINE TABLE
        </div>


        <input
            class="nameInput"
            id="playerName"
            type="text"
            maxlength="18"
            value="Nishan"
            placeholder="Enter your name"
            autocomplete="off"
        >


        <button
            class="joinBtn"
            id="startBtn"
            type="button"
        >
            JOIN TABLE
        </button>


        <div
            class="joinStatus"
            id="joinStatus"
        ></div>

    </div>

</div>


<audio
    id="bgAudio"
    src="assets/reference-audio.mp3"
    preload="auto"
    loop
></audio>


<script>

"use strict";


/* =========================
   ELEMENTS
========================= */

const start =
    document.getElementById("start");

const startBtn =
    document.getElementById("startBtn");

const playerName =
    document.getElementById("playerName");

const joinStatus =
    document.getElementById("joinStatus");

const status =
    document.getElementById("status");

const playersEl =
    document.getElementById("players");

const potEl =
    document.getElementById("pot");

const tableInfo =
    document.getElementById("tableInfo");

const toast =
    document.getElementById("toast");

const audio =
    document.getElementById("bgAudio");


/* =========================
   VARIABLES
========================= */

let ws = null;

let me = null;

let muted = false;

let connecting = false;


/* =========================
   TOAST
========================= */

function say(text){

    toast.textContent =
        text || "";

    toast.classList.add("show");

    clearTimeout(
        say.timer
    );

    say.timer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            1700
        );

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   CONNECT
========================= */

function connect(){

    if(connecting){

        return;

    }


    if(
        ws &&
        (
            ws.readyState ===
            WebSocket.OPEN ||

            ws.readyState ===
            WebSocket.CONNECTING
        )
    ){

        return;

    }


    connecting = true;


    const name =
        (
            playerName.value.trim()
            || "Player"
        )
        .slice(0,18);


    startBtn.disabled =
        true;

    startBtn.textContent =
        "CONNECTING...";

    joinStatus.textContent =
        "Connecting to table...";

    status.textContent =
        "Connecting...";


    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";


    const url =
        `${protocol}//${location.host}/?name=${
            encodeURIComponent(name)
        }`;


    try{

        ws =
            new WebSocket(url);

    }catch(error){

        connectionFailed();

        return;

    }


    ws.onopen = () => {

        joinStatus.textContent =
            "Connected. Joining...";

        say("Connected");

        audio.muted =
            muted;

        audio.play()
            .catch(() => {});

    };


    ws.onmessage = event => {

        let message;

        try{

            message =
                JSON.parse(
                    event.data
                );

        }catch(error){

            return;

        }


        /* =====================
           WELCOME
        ===================== */

        if(
            message.type ===
            "welcome"
        ){

            me =
                message.id;

            connecting =
                false;

            start.style.display =
                "none";

            startBtn.disabled =
                false;

            startBtn.textContent =
                "JOIN TABLE";

            joinStatus.textContent =
                "";

            status.textContent =
                "Waiting for players";

            say(
                `${message.name} joined`
            );

            return;

        }


        /* =====================
           STATE
        ===================== */

        if(
            message.type ===
            "state"
        ){

            render(message);

            return;

        }


        /* =====================
           NOTICE
        ===================== */

        if(
            message.type ===
            "notice"
        ){

            say(
                message.text || ""
            );

            return;

        }


        /* =====================
           RESULT
        ===================== */

        if(
            message.type ===
            "result"
        ){

            say(
                `${message.winnerName} won ${message.pot}`
            );

            return;

        }


        /* =====================
           FULL
        ===================== */

        if(
            message.type ===
            "full"
        ){

            connecting =
                false;

            startBtn.disabled =
                false;

            startBtn.textContent =
                "JOIN TABLE";

            joinStatus.textContent =
                "Table is full.";

            say(
                "Table is full"
            );

            return;

        }


        /* =====================
           ERROR
        ===================== */

        if(
            message.type ===
            "error"
        ){

            say(
                message.text ||
                "Game error"
            );

        }

    };


    ws.onerror = () => {

        connectionFailed();

    };


    ws.onclose = () => {

        connecting =
            false;

        if(me){

            status.textContent =
                "Disconnected";

            say(
                "Server disconnected"
            );

        }

        startBtn.disabled =
            false;

        startBtn.textContent =
            "JOIN TABLE";

    };

}


/* =========================
   CONNECTION FAILED
========================= */

function connectionFailed(){

    connecting =
        false;

    startBtn.disabled =
        false;

    startBtn.textContent =
        "JOIN TABLE";

    joinStatus.textContent =
        "Server connection failed.";

    status.textContent =
        "Connection failed";

    say(
        "Connection failed"
    );

}


/* =========================
   RENDER
========================= */

function render(state){

    if(
        !state ||
        !Array.isArray(
            state.players
        )
    ){

        return;

    }


    playersEl.innerHTML =
        "";


    const list =
        state.players
            .filter(
                p => p.connected
            );


    tableInfo.textContent =
        `PLAYERS ${list.length}/4`;


    potEl.textContent =
        `POT ${Number(
            state.pot || 0
        ).toLocaleString()}`;


    list.forEach(
        player => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                `player p${Number(
                    player.seat || 0
                )}`;


            const mine =
                player.id === me;


            const showCards =
                mine ||
                state.phase ===
                "finished";


            const cards =
                showCards
                    ? (
                        player.cards || []
                    )
                    : [];


            const cardsHtml =
                cards.map(
                    card => {

                        return `
                            <div class="card">
                                ${escapeHtml(
                                    card.rank +
                                    card.suit
                                )}
                            </div>
                        `;

                    }
                ).join("");


            div.innerHTML = `

                <div class="playerAvatar ${
                    state.turn === player.id
                    ? "turnGlow"
                    : ""
                }">

                    ${Number(
                        player.seat || 0
                    ) + 1}

                </div>

                <div class="playerName">

                    ${escapeHtml(
                        player.name ||
                        "Player"
                    )}

                    ${
                        player.packed
                        ? " — PACKED"
                        : ""
                    }

                </div>

                <div class="playerBalance">

                    ${Number(
                        player.balance || 0
                    ).toLocaleString()}

                </div>

                <div class="cards">

                    ${cardsHtml}

                </div>
            `;


            playersEl.appendChild(
                div
            );

        }
    );


    /*
       IMPORTANT:
       Waiting with 1 player
       MUST NOT show YOUR TURN.
    */

    if(
        state.phase ===
        "waiting"
    ){

        status.textContent =
            `Waiting for players (${list.length}/4)`;

        return;

    }


    if(
        state.phase ===
        "finished"
    ){

        status.textContent =
            `Round finished • Pot ${
                Number(
                    state.pot || 0
                ).toLocaleString()
            }`;

        return;

    }


    if(
        state.phase ===
        "playing"
    ){

        if(
            state.turn === me
        ){

            status.textContent =
                "YOUR TURN";

        }else{

            status.textContent =
                "Opponent's turn";

        }

    }

}


/* =========================
   SEND ACTION
========================= */

function sendAction(action){

    if(
        ws &&
        ws.readyState ===
        WebSocket.OPEN
    ){

        ws.send(
            JSON.stringify({

                type:"action",

                action

            })
        );

    }else{

        say(
            "Not connected"
        );

    }

}


/* =========================
   JOIN
========================= */

startBtn.addEventListener(
    "click",
    () => {

        if(
            !playerName.value.trim()
        ){

            playerName.value =
                "Nishan";

        }


        connect();

    }
);


/* ENTER KEY */

playerName.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            connect();

        }

    }
);

   SOUND
========================= */

document
    .getElementById("soundBtn")
    .addEventListener(
        "click",
        () => {

            muted =
                !muted;

            audio.muted =
                muted;


            document
                .getElementById(
                    "soundBtn"
                )
                .textContent =
                muted
                    ? "🔇"
                    : "🔊";


            if(!muted){

                audio.play()
                    .catch(() => {});

            }

        }
    );

========================= */

status.textContent =
    "Waiting for players";
